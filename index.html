<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的旅遊行程規劃 V1.8.0</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .column { min-width: 320px; max-width: 320px; height: calc(100vh - 180px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .img-preview { width: 100%; height: 200px; object-fit: contain; background: #0f172a; }
        .dragging-ghost { opacity: 0.4; transform: scale(0.98); box-shadow: none; border: 2px dashed #94a3b8; }
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing !important; }
        .clickable-area { pointer-events: auto; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="app" class="h-screen flex flex-col">
        
        <div v-if="!isLoggedIn" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 px-4">
            <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-8 text-center animate-in fade-in zoom-in duration-300">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800 mb-2">私人行程表</h2>
                <p class="text-xs text-slate-500 mb-6">安全連線中，請輸入存取密碼</p>
                <input type="password" v-model="loginPassword" @keyup.enter="handleLogin" 
                       class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 text-center tracking-widest font-mono focus:border-blue-500 outline-none transition-colors mb-4" 
                       placeholder="••••••••">
                <button @click="handleLogin" :disabled="loading"
                        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 disabled:bg-blue-400">
                    {{ loading ? '驗證中...' : '解鎖進入' }}
                </button>
            </div>
        </div>

        <template v-else>
            <header class="bg-gradient-to-r from-blue-900 to-indigo-950 text-white p-4 shadow-xl flex-none">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex flex-col">
                        <h1 class="text-xl font-black italic tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-plane-up"></i> TRAVEL PLANNER
                            <span class="text-[10px] bg-blue-700 text-blue-100 px-2 py-0.5 rounded-full not-italic font-mono border border-blue-600 shadow-inner tracking-normal">
                                {{ appVersion }}
                            </span>
                        </h1>
                        <span class="text-[10px] text-blue-200 mt-1">最後同步: {{ lastSyncTime }}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div v-if="loading" class="text-[10px] bg-white/20 px-2 py-1 rounded-full animate-pulse">{{ loadingMsg }}</div>
                        <button @click="fetchFromCloud" class="p-2 hover:bg-white/10 rounded-full transition"><i class="fa-solid fa-sync"></i></button>
                        <button @click="createNewTrip" class="bg-blue-500 hover:bg-blue-400 text-white font-bold px-3 py-1 rounded-lg text-sm shadow transition">+ 新行程</button>
                    </div>
                </div>
                
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    <button v-for="(trip, index) in trips" :key="index" @click="activeTripIndex = index"
                        :class="['px-5 py-1.5 rounded-full text-sm whitespace-nowrap transition-all', 
                                 activeTripIndex === index ? 'bg-white text-blue-900 font-bold shadow-md' : 'bg-white/10 text-blue-100 hover:bg-white/20']">
                        {{ trip.name }}
                    </button>
                </div>
            </header>

            <main class="flex-1 overflow-x-auto p-6 flex gap-6 items-start">
                <div v-for="(day, dIdx) in currentTrip.days" :key="dIdx" 
                     class="column flex flex-col bg-slate-200/50 rounded-3xl border border-slate-200 shadow-sm transition-transform duration-200"
                     draggable="true" @dragstart="handleDragStart('day', dIdx, null, $event)" @dragend="handleDragEnd($event)"
                     @dragover.prevent @dragenter.prevent @drop.stop="handleDrop('day', dIdx, null)">
                    
                    <div class="p-4 flex justify-between items-center border-b border-slate-100/50 cursor-grab active:cursor-grabbing">
                        <i class="fa-solid fa-grip-vertical text-slate-300 mr-2 hover:text-blue-500 transition"></i>
                        <input v-model="day.date" @blur="saveToCloud" class="bg-transparent font-black text-slate-700 w-full focus:outline-none text-lg">
                        <button @click="removeDay(dIdx)" class="text-slate-400 hover:text-red-500 transition ml-2"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </div>

                    <div class="flex-1 overflow-y-auto px-4 pb-4 space-y-4 pt-3 min-h-[150px]"
                         @dragover.prevent @dragenter.prevent @drop.stop="handleDrop('card', dIdx, null)">
                        
                        <div v-for="(card, cIdx) in day.cards" :key="cIdx" 
                             class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden group hover:shadow-md transition-shadow cursor-grab active:cursor-grabbing"
                             draggable="true" @dragstart.stop="handleDragStart('card', dIdx, cIdx, $event)" @dragend.stop="handleDragEnd($event)"
                             @dragover.prevent @dragenter.prevent @drop.stop="handleDrop('card', dIdx, cIdx)">
                            
                            <div v-if="card.images && card.images.length > 0" class="img-preview relative flex items-center justify-center">
                                <img :src="getDirectImageUrl(card.images[card.coverIndex || 0])" class="max-w-full max-h-full object-contain pointer-events-none" @error="handleImageError">
                                <span v-if="card.images.length > 1" class="absolute bottom-2 right-2 bg-black/70 text-white text-[9px] px-2 py-1 rounded-full tracking-wider font-bold">
                                    <i class="fa-solid fa-images mr-1"></i>{{ card.images.length }}
                                </span>
                            </div>
                            <div v-else-if="card.image" class="img-preview flex items-center justify-center">
                                <img :src="getDirectImageUrl(card.image)" class="max-w-full max-h-full object-contain pointer-events-none" @error="handleImageError">
                            </div>
                            
                            <div class="p-4">
                                <div class="flex flex-wrap gap-1 mb-2 pointer-events-none">
                                    <span v-for="tag in card.tags" :key="tag" :class="['text-[9px] px-2 py-0.5 rounded font-bold uppercase', getTagColor(tag)]">
                                        {{ tag }}
                                    </span>
                                </div>
                                
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold text-slate-800 leading-tight flex-1 pr-2 pointer-events-none">{{ card.title }}</h3>
                                    <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition clickable-area">
                                        <button @click.stop="copyCard(card)" class="text-slate-400 hover:text-emerald-500" title="複製此行程"><i class="fa-regular fa-copy"></i></button>
                                        <button @click.stop="editCard(dIdx, cIdx)" class="text-slate-400 hover:text-blue-600"><i class="fa-solid fa-pen-to-square"></i></button>
                                        <button @click.stop="removeCard(dIdx, cIdx)" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                                
                                <div v-if="card.desc" class="mb-3 bg-slate-50 p-3 rounded-xl border border-slate-100 cursor-pointer hover:bg-slate-100 transition clickable-area" @click.stop="toggleExpanded(dIdx, cIdx)">
                                    <div v-if="!isExpanded(dIdx, cIdx)" class="text-xs text-slate-500 line-clamp-2">{{ card.desc }}</div>
                                    <div v-else class="text-xs text-slate-700 whitespace-pre-wrap break-words" v-html="linkify(card.desc)"></div>
                                    <div class="text-center text-slate-300 mt-1"><i :class="isExpanded(dIdx, cIdx) ? 'fa-solid fa-chevron-up text-[9px]' : 'fa-solid fa-chevron-down text-[9px]'"></i></div>
                                </div>

                                <div v-if="card.checklist && card.checklist.length" class="mb-3 space-y-1 bg-slate-50 p-2 rounded-xl border border-slate-100 clickable-area">
                                    <div v-for="(item, iIdx) in card.checklist" :key="iIdx" class="flex items-center gap-2 text-[10px]">
                                        <input type="checkbox" v-model="item.done" @change="saveToCloud" class="rounded h-3 w-3 text-blue-600 border-slate-300">
                                        <span :class="{'line-through text-slate-400': item.done}" class="text-slate-600 truncate">{{ item.text }}</span>
                                    </div>
                                </div>

                                <div class="flex flex-wrap gap-2 mt-auto pt-2 border-t border-slate-50 clickable-area">
                                    <a v-if="card.mapLink" :href="card.mapLink" target="_blank" @click.stop class="text-[10px] font-bold bg-red-50 text-red-500 px-2 py-1 rounded hover:bg-red-100 transition flex items-center gap-1 max-w-full truncate">
                                        <i class="fa-solid fa-location-dot"></i> {{ card.mapName || 'Google Maps' }}
                                    </a>
                                    <a v-if="card.url" :href="card.url" target="_blank" @click.stop class="text-[10px] font-bold bg-blue-50 text-blue-500 px-2 py-1 rounded hover:bg-blue-100 transition flex items-center gap-1 max-w-full truncate">
                                        <i class="fa-solid fa-link"></i> {{ card.urlName || '參考網頁' }}
                                    </a>
                                </div>
                            </div>
                        </div>
                        
                        <button v-if="clipboardCard" @click="pasteCard(dIdx)" class="w-full py-2 bg-emerald-50 text-emerald-600 border-2 border-dashed border-emerald-200 rounded-xl hover:bg-emerald-100 font-bold transition-all shadow-sm mb-2 text-sm">
                            <i class="fa-solid fa-paste mr-1"></i> 貼上「{{ clipboardCard.title }}」
                        </button>
                        
                        <button @click="openCardModal(dIdx)" class="w-full py-4 border-2 border-dashed border-slate-200 text-slate-400 rounded-2xl hover:bg-white hover:text-blue-500 hover:border-blue-200 font-bold transition-all shadow-sm">
                            + 新增任務 / 景點
                        </button>
                    </div>
                </div>
                
                <button @click="addDay" class="column flex flex-col items-center justify-center bg-white/40 border-2 border-dashed border-slate-200 rounded-3xl text-slate-400 hover:bg-white hover:text-blue-500 hover:border-blue-200 transition-all font-bold shadow-sm h-[200px]">
                    <i class="fa-solid fa-plus-circle text-2xl mb-1"></i>
                    <span>新增區塊</span>
                </button>
            </main>

            <div v-if="showModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">
                <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in duration-200">
                    <div class="p-6 overflow-y-auto max-h-[85vh]">
                        <h2 class="text-xl font-black text-slate-800 mb-6 border-l-4 border-blue-600 pl-3">編輯細節</h2>
                        <div class="space-y-6">
                            <div>
                                <div class="flex flex-wrap gap-2">
                                    <button v-for="t in defaultTags" :key="t" @click="toggleTag(t)"
                                        :class="['px-3 py-1 rounded-lg text-xs font-bold transition-all border', 
                                                 form.tags.includes(t) ? getTagColor(t) + ' border-transparent shadow-sm' : 'bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-100']">
                                        {{ t }}
                                    </button>
                                    <button @click="addNewTag" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-sm">+ 自訂</button>
                                </div>
                            </div>

                            <input v-model="form.title" class="w-full border-b-2 border-slate-100 p-2 font-bold focus:border-blue-500 outline-none text-lg" placeholder="景點或任務名稱 *">

                            <div class="bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                                <div class="flex justify-between items-center mb-3">
                                    <label class="text-[10px] font-black text-blue-500 uppercase tracking-widest">檢查清單</label>
                                    <button @click="form.checklist.push({text:'', done:false})" class="text-[10px] font-bold text-white bg-blue-500 px-3 py-1 rounded-full hover:bg-blue-600 transition shadow-sm">+ 新增</button>
                                </div>
                                <div class="space-y-2">
                                    <div v-for="(item, i) in form.checklist" :key="i" class="flex gap-2 items-center">
                                        <input type="checkbox" v-model="item.done" class="rounded h-4 w-4 text-blue-600 border-slate-300">
                                        <input v-model="item.text" class="flex-1 bg-white border border-slate-200 rounded-lg p-2 text-xs focus:ring-1 ring-blue-100 outline-none" placeholder="做什麼呢？">
                                        <button @click="form.checklist.splice(i, 1)" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-minus-circle text-sm"></i></button>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-slate-50 p-4 rounded-2xl border-2 border-dashed border-slate-200">
                                <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest flex justify-between items-center">
                                    <span>多圖片管理 (上傳或輸入網址)</span>
                                    <span v-if="form.images.length > 0" class="text-blue-500">{{ form.images.length }} 張圖片</span>
                                </label>
                                
                                <div class="flex flex-col gap-2 mb-3">
                                    <input type="file" @change="uploadToImgbb" accept="image/*" class="w-full text-xs text-slate-500 p-2 border border-slate-200 rounded-lg bg-white" :disabled="uploadingImage">
                                    
                                    <div class="flex gap-2">
                                        <input v-model="tempImageUrl" class="flex-1 bg-white border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-1 ring-blue-100" placeholder="或貼上 Google Drive 等圖片網址">
                                        <button @click="addManualImage" class="bg-blue-100 text-blue-600 hover:bg-blue-200 px-3 py-2 rounded-lg text-xs font-bold transition">加入</button>
                                    </div>
                                </div>
                                
                                <div v-if="form.images.length > 0" class="grid grid-cols-3 gap-2 mt-4 p-2 bg-slate-200/50 rounded-xl">
                                    <div v-for="(img, idx) in form.images" :key="idx" 
                                         class="relative rounded-lg overflow-hidden border-2 transition-all cursor-pointer hover:opacity-80" 
                                         :class="{'border-blue-500 shadow-md scale-105': form.coverIndex === idx, 'border-transparent': form.coverIndex !== idx}"
                                         @click="form.coverIndex = idx">
                                        
                                        <img :src="getDirectImageUrl(img)" class="w-full h-20 object-cover bg-slate-900 pointer-events-none">
                                        
                                        <span v-if="form.coverIndex === idx" class="absolute bottom-1 left-1 text-[9px] px-1.5 py-0.5 bg-blue-600 text-white rounded font-bold shadow">封面</span>
                                        
                                        <button @click.stop="removeImage(idx)" class="absolute top-1 right-1 text-[10px] bg-red-500/80 hover:bg-red-600 text-white w-5 h-5 flex items-center justify-center rounded-full transition">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <textarea v-model="form.desc" class="w-full bg-slate-50 rounded-2xl p-4 text-sm h-24 outline-none border-2 border-transparent focus:border-blue-100" placeholder="補充詳細描述... (輸入的網址會自動變成可點擊連結)"></textarea>
                            
                            <div class="space-y-3">
                                <div class="flex gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <div class="w-1/3">
                                        <label class="text-[9px] text-slate-400 font-bold uppercase">地圖名稱</label>
                                        <input v-model="form.mapName" class="w-full mt-1 bg-white border border-slate-200 rounded p-2 text-xs outline-none focus:ring-1 ring-blue-100" placeholder="例: 東京鐵塔">
                                    </div>
                                    <div class="w-2/3">
                                        <label class="text-[9px] text-slate-400 font-bold uppercase">Google Maps 網址</label>
                                        <input v-model="form.mapLink" class="w-full mt-1 bg-white border border-slate-200 rounded p-2 text-xs outline-none focus:ring-1 ring-blue-100" placeholder="https://maps.app.goo.gl/...">
                                    </div>
                                </div>
                                <div class="flex gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <div class="w-1/3">
                                        <label class="text-[9px] text-slate-400 font-bold uppercase">網頁名稱</label>
                                        <input v-model="form.urlName" class="w-full mt-1 bg-white border border-slate-200 rounded p-2 text-xs outline-none focus:ring-1 ring-blue-100" placeholder="例: 官網預訂">
                                    </div>
                                    <div class="w-2/3">
                                        <label class="text-[9px] text-slate-400 font-bold uppercase">網頁連結</label>
                                        <input v-model="form.url" class="w-full mt-1 bg-white border border-slate-200 rounded p-2 text-xs outline-none focus:ring-1 ring-blue-100" placeholder="https://...">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="p-6 bg-slate-50 flex gap-4 mt-4">
                            <button @click="showModal = false" class="flex-1 py-4 text-slate-500 font-bold hover:bg-slate-200 rounded-2xl transition" :disabled="uploadingImage">取消</button>
                            <button @click="saveCard" class="flex-1 py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-xl hover:bg-blue-700 transition" :disabled="loading || uploadingImage">
                                {{ loading ? '資料同步中...' : (uploadingImage ? '上傳圖床中...' : '確認儲存') }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbwqzmka9Jgzdh54E_NjWDKruM1_beHY0gTvUhtt5IvWORPVnAied4zt2swJEK3l0crv/exec";
        const IMGBB_API_KEY = "4c98acba6c808fd9ac1815a2bd502e1f"; 
        const SECRET_PASSWORD = "cathy2026"; 

        createApp({
            setup() {
                const appVersion = ref('V1.8.0');
                const isLoggedIn = ref(false);
                const loginPassword = ref('');
                
                const trips = ref([{ name: '新增旅程', days: [{ date: 'Day 1', cards: [] }] }]);
                const activeTripIndex = ref(0);
                const loading = ref(false);
                const uploadingImage = ref(false);
                const loadingMsg = ref('同步中...');
                const showModal = ref(false);
                const isEditing = ref(false);
                const lastSyncTime = ref('--:--');
                
                // 標籤顏色字典 (自動對應顏色)
                const tagColorMap = {
                    '機票': 'bg-sky-100 text-sky-700 border-sky-200',
                    '住宿': 'bg-indigo-100 text-indigo-700 border-indigo-200',
                    '交通': 'bg-emerald-100 text-emerald-700 border-emerald-200',
                    '美食': 'bg-orange-100 text-orange-700 border-orange-200',
                    '景點': 'bg-rose-100 text-rose-700 border-rose-200',
                    '購物': 'bg-fuchsia-100 text-fuchsia-700 border-fuchsia-200'
                };
                const defaultTags = ref(Object.keys(tagColorMap));
                
                const form = ref({ title: '', desc: '', images: [], coverIndex: 0, mapLink: '', mapName: '', url: '', urlName: '', checklist: [], tags: [] });
                const tempImageUrl = ref(''); // 暫存手動輸入的圖片網址
                
                const editingPos = ref({ day: 0, card: 0 });
                const dragInfo = ref({ type: null, dIdx: null, cIdx: null });
                const expandedCards = ref({});
                const clipboardCard = ref(null); // 剪貼簿

                const currentTrip = computed(() => trips.value[activeTripIndex.value] || trips.value[0]);

                // --- 標籤色彩處理 ---
                const getTagColor = (tag) => {
                    return tagColorMap[tag] || 'bg-slate-200 text-slate-700 border-slate-300';
                };

                // --- 複製與貼上 ---
                const copyCard = (cardData) => {
                    // 深拷貝一份資料到剪貼簿
                    clipboardCard.value = JSON.parse(JSON.stringify(cardData));
                    // 使用原生 alert 或是你可以做一個精美的小 Toast
                    alert(`已複製「${cardData.title}」！您可以切換到其他行程貼上。`);
                };

                const pasteCard = (dayIdx) => {
                    if (clipboardCard.value) {
                        const newCard = JSON.parse(JSON.stringify(clipboardCard.value));
                        currentTrip.value.days[dayIdx].cards.push(newCard);
                        saveToCloud();
                        // 貼上後保留剪貼簿，方便連續貼上多天
                    }
                };

                // --- 登入邏輯 ---
                const handleLogin = async () => {
                    if (!loginPassword.value) return alert('請輸入密碼');
                    loading.value = true;
                    try {
                        const res = await fetch(`${CLOUD_API_URL}?pwd=${loginPassword.value}`);
                        const data = await res.json();
                        if (data.error) { alert('密碼錯誤！'); loginPassword.value = ''; } 
                        else { isLoggedIn.value = true; if (Array.isArray(data) && data.length > 0) trips.value = data; }
                    } catch (e) { alert('連線失敗'); } finally { loading.value = false; }
                };

                const toggleExpanded = (dIdx, cIdx) => { expandedCards.value[`${dIdx}-${cIdx}`] = !expandedCards.value[`${dIdx}-${cIdx}`]; };
                const isExpanded = (dIdx, cIdx) => !!expandedCards.value[`${dIdx}-${cIdx}`];
                const linkify = (text) => {
                    if (!text) return '';
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    return text.replace(/</g, "<").replace(/>/g, ">").replace(urlRegex, (url) => `<a href="${url}" target="_blank" class="text-blue-500 font-bold underline" onclick="event.stopPropagation()">${url}</a>`).replace(/\n/g, '<br/>');
                };

                // --- 拖曳事件 ---
                const handleDragStart = (type, dIdx, cIdx, event) => {
                    dragInfo.value = { type, dIdx, cIdx };
                    event.dataTransfer.effectAllowed = 'move';
                    setTimeout(() => event.target.classList.add('dragging-ghost'), 0);
                };
                const handleDragEnd = (event) => {
                    event.target.classList.remove('dragging-ghost');
                    dragInfo.value = { type: null, dIdx: null, cIdx: null };
                };
                const handleDrop = (targetType, targetDIdx, targetCIdx) => {
                    const { type, dIdx, cIdx } = dragInfo.value;
                    if (!type || type !== targetType) return;
                    if (type === 'day') {
                        if (dIdx === targetDIdx) return;
                        const movedDay = currentTrip.value.days.splice(dIdx, 1)[0];
                        currentTrip.value.days.splice(targetDIdx, 0, movedDay);
                    } else if (type === 'card') {
                        if (dIdx === targetDIdx && cIdx === targetCIdx) return;
                        const movedCard = currentTrip.value.days[dIdx].cards.splice(cIdx, 1)[0];
                        if (targetCIdx !== null) currentTrip.value.days[targetDIdx].cards.splice(targetCIdx, 0, movedCard);
                        else currentTrip.value.days[targetDIdx].cards.push(movedCard);
                    }
                    saveToCloud();
                };

                // --- 圖片上傳與多圖管理 ---
                const uploadToImgbb = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    uploadingImage.value = true;
                    loadingMsg.value = '上傳圖床中...';
                    loading.value = true;
                    const formData = new FormData();
                    formData.append('image', file);
                    try {
                        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                        const data = await response.json();
                        if (data.success) { 
                            form.value.images.push(data.data.url); 
                        } else { alert("圖片上傳失敗：" + data.error.message); }
                    } catch (err) { alert("無法連線至圖床"); } 
                    finally { uploadingImage.value = false; loading.value = false; loadingMsg.value = '同步中...'; e.target.value = ''; }
                };

                const addManualImage = () => {
                    if (tempImageUrl.value.trim()) {
                        form.value.images.push(tempImageUrl.value.trim());
                        tempImageUrl.value = '';
                    }
                };

                const removeImage = (idx) => {
                    form.value.images.splice(idx, 1);
                    // 如果刪掉的是目前的封面，或是後面的圖片往前遞補，確保 coverIndex 不會越界
                    if (form.value.coverIndex >= form.value.images.length) {
                        form.value.coverIndex = Math.max(0, form.value.images.length - 1);
                    }
                };

                const getDirectImageUrl = (url) => {
                    if (!url) return '';
                    const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^\/]+)/);
                    if (driveMatch) return `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
                    return url;
                };
                const handleImageError = (e) => { e.target.style.display = 'none'; };

                // --- 雲端資料抓取 ---
                const fetchFromCloud = async () => {
                    if (loading.value || showModal.value || !isLoggedIn.value) return;
                    loading.value = true;
                    loadingMsg.value = '抓取中...';
                    try {
                        const res = await fetch(`${CLOUD_API_URL}?pwd=${loginPassword.value}`);
                        const data = await res.json();
                        if (!data.error && Array.isArray(data)) trips.value = data;
                        lastSyncTime.value = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    } catch (e) { console.error(e); } finally { loading.value = false; }
                };

                const saveToCloud = async () => {
                    loading.value = true;
                    loadingMsg.value = '切塊存檔中...';
                    try {
                        await fetch(`${CLOUD_API_URL}?pwd=${loginPassword.value}`, { 
                            method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain"},
                            body: JSON.stringify(trips.value) 
                        });
                        setTimeout(() => { 
                            loading.value = false; 
                            lastSyncTime.value = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); 
                        }, 1000);
                    } catch (e) { loading.value = false; }
                };

                const openCardModal = (dayIdx) => {
                    isEditing.value = false;
                    editingPos.value.day = dayIdx;
                    form.value = { title: '', desc: '', images: [], coverIndex: 0, mapLink: '', mapName: '', url: '', urlName: '', checklist: [], tags: [] };
                    tempImageUrl.value = '';
                    showModal.value = true;
                };

                const editCard = (dayIdx, cardIdx) => {
                    isEditing.value = true;
                    editingPos.value = { day: dayIdx, card: cardIdx };
                    const rawData = JSON.parse(JSON.stringify(currentTrip.value.days[dayIdx].cards[cardIdx]));
                    
                    // 向下相容處理：舊版單圖轉換為新版多圖陣列
                    if (rawData.image && (!rawData.images || rawData.images.length === 0)) {
                        rawData.images = [rawData.image];
                    }
                    if (!rawData.images) rawData.images = [];
                    if (typeof rawData.coverIndex === 'undefined') rawData.coverIndex = 0;
                    if (!rawData.checklist) rawData.checklist = [];
                    if (!rawData.tags) rawData.tags = [];
                    
                    form.value = rawData;
                    tempImageUrl.value = '';
                    showModal.value = true;
                };

                const saveCard = () => {
                    if (!form.value.title) return alert('請輸入標題');
                    if (isEditing.value) currentTrip.value.days[editingPos.value.day].cards[editingPos.value.card] = JSON.parse(JSON.stringify(form.value));
                    else currentTrip.value.days[editingPos.value.day].cards.push(JSON.parse(JSON.stringify(form.value)));
                    showModal.value = false;
                    saveToCloud();
                };

                const removeCard = (d, c) => { if(confirm('確定刪除？')) { currentTrip.value.days[d].cards.splice(c, 1); saveToCloud(); }};
                const createNewTrip = () => { const n = prompt('行程名稱？'); if(n){ trips.value.push({name:n, days:[{date:'Day 1', cards:[]}]}); saveToCloud(); }};
                const addDay = () => { currentTrip.value.days.push({date:'新欄位', cards:[]}); saveToCloud(); };
                const removeDay = (idx) => { if(confirm('刪除整欄？')) { currentTrip.value.days.splice(idx,1); saveToCloud(); }};

                const toggleTag = (tag) => {
                    if (!form.value.tags) form.value.tags = [];
                    const idx = form.value.tags.indexOf(tag);
                    if (idx > -1) form.value.tags.splice(idx, 1);
                    else form.value.tags.push(tag);
                };
                
                const addNewTag = () => {
                    const t = prompt("標籤名稱");
                    if (t && !defaultTags.value.includes(t)) {
                        defaultTags.value.push(t);
                        // 可以為自訂標籤隨機分配顏色，或給統一顏色，這邊預設為統一的灰色底
                        if(!tagColorMap[t]) tagColorMap[t] = 'bg-slate-200 text-slate-700 border-slate-300';
                    }
                };

                onMounted(() => {
                    setInterval(() => {
                        if (isLoggedIn.value) fetchFromCloud(); 
                    }, 40000);
                });

                return {
                    appVersion, isLoggedIn, loginPassword, handleLogin,
                    trips, activeTripIndex, currentTrip, loading, loadingMsg, uploadingImage, showModal, isEditing, form, tempImageUrl, lastSyncTime, defaultTags,
                    expandedCards, toggleExpanded, isExpanded, linkify, getTagColor,
                    clipboardCard, copyCard, pasteCard,
                    uploadToImgbb, addManualImage, removeImage, fetchFromCloud, saveToCloud, openCardModal, editCard, saveCard, removeCard, createNewTrip, addDay, removeDay, toggleTag, addNewTag, getDirectImageUrl, handleImageError,
                    handleDragStart, handleDragEnd, handleDrop
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
