<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的旅遊行程規劃 V1.12.1</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [v-cloak] { display: none; }
        .column { min-width: 320px; max-width: 320px; height: calc(100vh - 180px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .img-preview { width: 100%; height: 200px; object-fit: contain; background: #0f172a; }
        .dragging-ghost { opacity: 0.4; transform: scale(0.98); box-shadow: none; border: 2px dashed #94a3b8; }
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing !important; }
        .clickable-area { pointer-events: auto; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <!--
    @Author:      cathy_liu 劉詩敏
    @Date:        2026-09-13
    @Description: 旅遊行程管理工具 V1.12.1 (多人協作合併同步版・修補舊資料遷移風險)
                  1. 修正多人同時編輯時資料互相蓋掉的問題（Lost Update）：
                     為每個行程/天/卡片加上唯一 id 與 updatedAt 時間戳記。
                  2. saveToCloud / fetchFromCloud 改為「三方合併 (3-way merge)」，
                     存檔前會先抓雲端最新版，用 base(上次同步版)／local(本機)／remote(雲端)
                     三份資料比對，新增/刪除以 id 是否存在判斷，同一筆資料被兩邊都改到
                     時才用 updatedAt 較新的一方為準，不再整包互相覆蓋。
                  3. 新增 isSyncing 鎖，避免同一時間重複觸發同步造成競爭寫入。
                  4. 舊資料（沒有 id/updatedAt 欄位）會在讀取時自動補齊，向下相容。
                  5. 背景輪詢間隔由 40 秒縮短為 25 秒，降低衝突視窗。
                  6. 保留 V1.11.3 的視窗焦點/可見度偵測強制同步機制。
                  7.【V1.12.1 修補】舊格式資料（無 id）登入時偵測到就立刻把補好 id 的
                     版本寫回雲端，避免過渡期間每次重新抓取都各自產生不同的隨機 id，
                     導致三方合併誤判成「舊資料被刪除、新增了內容一樣的新資料」而
                     把過渡期剛做的編輯洗掉。
                  已知限制：若兩人在「同一瞬間」對同一份清單做純粹拖曳排序（沒有新增/
                  刪除/修改內容），目前以雲端當時順序為主、本機新增項目補在最後，
                  排序本身不做合併。若需要完全即時、零衝突的協作，建議未來把後端從
                  Google Apps Script 整包 JSON 儲存，換成 Firebase Firestore 之類支援
                  單筆寫入的資料庫。
    @Version:     V1.12.1
    -->

    <div id="app" class="h-screen flex flex-col" @click="clearClipboard" v-cloak>
        
        <!-- 🔍 圖片放大檢視 -->
        <div v-if="viewingImage" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 p-4 animate-in fade-in duration-200" @click.stop="viewingImage = null">
            <button class="absolute top-4 right-4 text-white hover:text-red-500 text-3xl transition"><i class="fa-solid fa-xmark"></i></button>
            <img :src="viewingImage" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl" @click.stop>
        </div>

        <!-- 📝 內文詳細檢視彈窗 -->
        <div v-if="viewingDescCard" class="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/60 p-4 backdrop-blur-sm animate-in fade-in duration-200" @click.stop="viewingDescCard = null">
            <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]" @click.stop>
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h3 class="font-black text-slate-800 text-lg flex-1 pr-2 truncate"><i class="fa-regular fa-file-lines text-blue-500 mr-2"></i>{{ viewingDescCard.title }}</h3>
                    <button @click="viewingDescCard = null" class="text-slate-400 hover:text-red-500 transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="p-6 overflow-y-auto flex-1">
                    <div class="text-sm text-slate-700 whitespace-pre-wrap break-words leading-relaxed" v-html="linkify(viewingDescCard.desc)"></div>
                </div>
                <div class="p-4 border-t border-slate-100 bg-slate-50">
                    <button @click="viewingDescCard = null" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all active:scale-95 shadow-md">關閉</button>
                </div>
            </div>
        </div>

        <!-- 🔄 行程小卡排序專屬彈窗 -->
        <div v-if="cardMoveModalPos" class="fixed inset-0 z-[120] flex items-center justify-center bg-slate-900/60 p-4 backdrop-blur-sm animate-in fade-in duration-200" @click.stop="cardMoveModalPos = null">
            <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]" @click.stop>
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h3 class="font-black text-slate-800 text-lg flex-1 pr-2 truncate">
                        <i class="fa-solid fa-arrows-up-down text-indigo-500 mr-2"></i>移動行程位置
                    </h3>
                    <button @click="cardMoveModalPos = null" class="text-slate-400 hover:text-red-500 transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="p-4 overflow-y-auto flex-1 bg-slate-50/50">
                    <div class="text-xs text-slate-500 mb-3 font-bold">請選擇「{{ currentTrip.days[cardMoveModalPos.dIdx].cards[cardMoveModalPos.cIdx].title || '未命名' }}」要移動到的順序：</div>
                    <div class="space-y-2">
                        <button v-for="(cardItem, targetIdx) in currentTrip.days[cardMoveModalPos.dIdx].cards" :key="targetIdx"
                                @click.stop="moveCardToPosition(targetIdx)"
                                class="w-full text-left px-4 py-3 rounded-xl border transition-all font-medium truncate flex items-center gap-3"
                                :class="{'bg-indigo-50 border-indigo-200 text-indigo-700 shadow-sm': cardMoveModalPos.cIdx === targetIdx, 'bg-white border-slate-200 text-slate-700 hover:border-indigo-300 hover:shadow': cardMoveModalPos.cIdx !== targetIdx}"
                                :title="cardItem.title">
                            <span class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black" :class="cardMoveModalPos.cIdx === targetIdx ? 'bg-indigo-200 text-indigo-800' : 'bg-slate-100 text-slate-500'">{{ targetIdx + 1 }}</span>
                            <span class="truncate">{{ cardItem.title || '未命名' }}</span>
                            <span v-if="cardMoveModalPos.cIdx === targetIdx" class="ml-auto text-[10px] font-bold bg-indigo-100 px-2 py-0.5 rounded text-indigo-600">目前位置</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 🔒 登入畫面 -->
        <div v-if="!isLoggedIn" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 px-4">
            <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-8 text-center animate-in fade-in zoom-in duration-300">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800 mb-2">私人行程表</h2>
                <p class="text-xs text-slate-500 mb-6">安全連線中，請輸入存取密碼</p>
                <input type="password" v-model="loginPassword" @keyup.enter="handleLogin" 
                       class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 text-center tracking-widest font-mono focus:border-blue-500 outline-none transition-colors mb-4" 
                       placeholder="••••••••">
                <button @click="handleLogin" :disabled="loading"
                        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95 disabled:bg-blue-400">
                    {{ loading ? '驗證中...' : '解鎖進入' }}
                </button>
            </div>
        </div>

        <!-- 🔓 主程式 -->
        <template v-else>
            <header class="bg-gradient-to-r from-blue-900 to-indigo-950 text-white p-4 shadow-xl flex-none">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex flex-col">
                        <h1 class="text-xl font-black italic tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-plane-up"></i> TRAVEL PLANNER
                            <span class="text-[10px] bg-blue-700 text-blue-100 px-2 py-0.5 rounded-full not-italic font-mono border border-blue-600 shadow-inner tracking-normal">
                                {{ appVersion }}
                            </span>
                        </h1>
                        <span class="text-[10px] text-blue-200 mt-1">最後同步: {{ lastSyncTime }}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div v-if="loading" class="text-[10px] bg-white/20 px-2 py-1 rounded-full animate-pulse">{{ loadingMsg }}</div>
                        <button @click.stop="fetchFromCloud" class="p-2 hover:bg-white/10 rounded-full transition"><i class="fa-solid fa-sync"></i></button>
                        <button @click.stop="createNewTrip" class="bg-blue-500 hover:bg-blue-400 text-white font-bold px-3 py-1 rounded-lg text-sm shadow transition">+ 新行程</button>
                    </div>
                </div>
                
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" @dragover.prevent @dragenter.prevent>
                    <button v-for="(trip, index) in trips" :key="'trip-'+index" 
                        draggable="true"
                        @dragstart="handleTripDragStart(index, $event)"
                        @dragend="handleTripDragEnd($event)"
                        @drop.stop="handleTripDrop(index)"
                        @dragover.prevent
                        @dragenter.prevent
                        @click.stop="activeTripIndex = index"
                        :class="['px-4 py-1.5 rounded-full text-sm whitespace-nowrap transition-all flex items-center gap-2 cursor-grab active:cursor-grabbing', 
                                 activeTripIndex === index ? 'bg-white text-blue-900 font-bold shadow-md' : 'bg-white/10 text-blue-100 hover:bg-white/20']">
                        
                        <i class="fa-solid fa-grip-vertical opacity-40 text-[10px]"></i>
                        <span>{{ trip.name }}</span>
                        
                        <div v-if="activeTripIndex === index" class="flex gap-2 ml-1 border-l border-slate-200 pl-2 text-slate-400 clickable-area">
                            <i class="fa-solid fa-pen hover:text-blue-600 transition cursor-pointer" @click.stop="editTripName" title="編輯行程名稱"></i>
                            <i class="fa-solid fa-trash hover:text-red-500 transition cursor-pointer" @click.stop="deleteTrip" title="刪除此行程"></i>
                        </div>
                    </button>
                </div>
            </header>

            <main class="flex-1 overflow-x-auto p-6 flex gap-6 items-start">
                <div v-for="(day, dIdx) in currentTrip.days" :key="dIdx" 
                     class="column flex flex-col bg-slate-200/50 rounded-3xl border border-slate-200 shadow-sm transition-transform duration-200"
                     draggable="true" @dragstart="handleDragStart('day', dIdx, null, $event)" @dragend="handleDragEnd($event)"
                     @dragover.prevent @dragenter.prevent @drop.stop="handleDrop('day', dIdx, null)">
                    
                    <div class="p-4 flex justify-between items-center border-b border-slate-100/50 cursor-grab active:cursor-grabbing">
                        <div class="flex items-center">
                            <i class="fa-solid fa-grip-vertical text-slate-300 mr-2 hover:text-blue-500 transition"></i>
                            
                            <div class="relative clickable-area mr-1">
                                <button @click.stop="toggleDayMoveMenu(dIdx)" class="text-slate-400 hover:text-blue-600 transition w-5 h-5 flex items-center justify-center rounded hover:bg-slate-300/50" title="選單調整欄位位置">
                                    <i class="fa-solid fa-arrows-left-right text-xs"></i>
                                </button>
                                <div v-if="activeDayMoveIdx === dIdx" class="absolute top-7 left-0 bg-white border border-slate-200 rounded-xl shadow-xl p-2 z-30 w-56 space-y-1 font-sans">
                                    <div class="text-[10px] text-slate-400 font-bold px-2 pb-1 border-b">移動到指定欄位：</div>
                                    <button v-for="(dayItem, targetIdx) in currentTrip.days" :key="targetIdx"
                                            @click.stop="moveDayToPosition(dIdx, targetIdx)"
                                            class="w-full text-left text-xs px-2 py-1.5 rounded-lg hover:bg-slate-100 transition text-slate-700 font-medium truncate"
                                            :class="{'bg-blue-50 text-blue-600 font-bold': dIdx === targetIdx}"
                                            :title="dayItem.date">
                                        {{ targetIdx + 1 }}. {{ dayItem.date || '未命名' }} {{ dIdx === targetIdx ? '(目前)' : '' }}
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <input v-model="day.date" @blur="() => { touch(day); saveToCloud(); }" @click.stop class="bg-transparent font-black text-slate-700 w-full focus:outline-none text-lg px-1">
                        
                        <div class="flex gap-2 items-center ml-2 clickable-area">
                            <button @click.stop="copyDay(day)" class="text-slate-400 hover:text-emerald-500 transition" title="複製此欄 (可跨看板貼上)"><i class="fa-regular fa-copy text-sm"></i></button>
                            <button @click.stop="removeDay(dIdx)" class="text-slate-400 hover:text-red-500 transition"><i class="fa-solid fa-trash-can text-sm"></i></button>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto px-4 pb-4 space-y-4 pt-3 min-h-[150px]"
                         @dragover.prevent @dragenter.prevent @drop.stop="handleDrop('card', dIdx, null)">
                        
                        <div v-for="(card, cIdx) in day.cards" :key="cIdx" 
                             class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden group hover:shadow-md transition-shadow cursor-grab active:cursor-grabbing"
                             draggable="true" @dragstart.stop="handleDragStart('card', dIdx, cIdx, $event)" @dragend.stop="handleDragEnd($event)"
                             @dragover.prevent @dragenter.prevent @drop.stop="handleDrop('card', dIdx, cIdx)">
                            
                            <div v-if="card.images && card.images.length > 0" 
                                 class="img-preview relative flex items-center justify-center cursor-pointer group/img clickable-area"
                                 @click.stop="viewImage(getDirectImageUrl(card.images[card.coverIndex || 0]))">
                                <img :src="getDirectImageUrl(card.images[card.coverIndex || 0])" class="max-w-full max-h-full object-contain pointer-events-none" @error="handleImageError">
                                <div class="absolute inset-0 bg-black/30 opacity-0 group-hover/img:opacity-100 flex items-center justify-center transition">
                                    <i class="fa-solid fa-magnifying-glass-plus text-white text-3xl drop-shadow-lg"></i>
                                </div>
                                <span v-if="card.images.length > 1" class="absolute bottom-2 right-2 bg-black/70 text-white text-[9px] px-2 py-1 rounded-full tracking-wider font-bold">
                                    <i class="fa-solid fa-images mr-1"></i>{{ card.images.length }}
                                </span>
                            </div>
                            <div v-else-if="card.image && card.showImage" 
                                 class="img-preview relative flex items-center justify-center cursor-pointer group/img clickable-area"
                                 @click.stop="viewImage(getDirectImageUrl(card.image))">
                                <img :src="getDirectImageUrl(card.image)" class="max-w-full max-h-full object-contain pointer-events-none" @error="handleImageError">
                                <div class="absolute inset-0 bg-black/30 opacity-0 group-hover/img:opacity-100 flex items-center justify-center transition">
                                    <i class="fa-solid fa-magnifying-glass-plus text-white text-3xl drop-shadow-lg"></i>
                                </div>
                            </div>
                            
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-2 min-h-[24px]">
                                    <div class="flex flex-wrap gap-1 pointer-events-none flex-1 mr-2">
                                        <span v-for="tag in card.tags" :key="tag" :class="['text-[9px] px-2 py-0.5 rounded font-bold uppercase', getTagColor(tag)]">
                                            {{ tag }}
                                        </span>
                                    </div>
                                    <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition clickable-area items-center shrink-0">
                                        <button @click.stop="openCardMoveModal(dIdx, cIdx)" class="text-slate-400 hover:text-indigo-600 transition w-5 h-5 flex items-center justify-center rounded hover:bg-slate-100" title="選單調整行程順序">
                                            <i class="fa-solid fa-arrows-up-down text-xs"></i>
                                        </button>
                                        <button @click.stop="copyCard(card)" class="text-slate-400 hover:text-emerald-500" title="複製此行程 (可跨看板貼上)"><i class="fa-regular fa-copy"></i></button>
                                        <button @click.stop="editCard(dIdx, cIdx)" class="text-slate-400 hover:text-blue-600"><i class="fa-solid fa-pen-to-square"></i></button>
                                        <button @click.stop="removeCard(dIdx, cIdx)" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                                
                                <div class="mb-2">
                                    <h3 class="font-bold text-slate-800 leading-tight pointer-events-none break-words">{{ card.title }}</h3>
                                </div>
                                
                                <div v-if="card.desc" class="mb-3 bg-slate-50 p-3 rounded-xl border border-slate-100 cursor-pointer hover:bg-slate-100 transition clickable-area group/desc" @click.stop="viewDesc(card)">
                                    <div class="text-xs text-slate-500 line-clamp-2">
                                        {{ card.desc }}
                                    </div>
                                    <div class="text-center text-slate-400 mt-2 opacity-60 group-hover/desc:opacity-100 transition">
                                        <i class="fa-solid fa-up-right-and-down-left-from-center text-[10px]"></i> <span class="text-[10px] ml-1">點擊查看完整備註</span>
                                    </div>
                                </div>

                                <div v-if="card.checklist && card.checklist.length" class="mb-3 space-y-1 bg-slate-50 p-2 rounded-xl border border-slate-100 clickable-area">
                                    <div v-for="(item, iIdx) in card.checklist" :key="iIdx" class="flex items-center gap-2 text-[10px]">
                                        <input type="checkbox" v-model="item.done" @change="() => { touch(card); saveToCloud(); }" @click.stop class="rounded h-3 w-3 text-blue-600 border-slate-300">
                                        <span :class="{'line-through text-slate-400': item.done}" class="text-slate-600 truncate">{{ item.text }}</span>
                                    </div>
                                </div>

                                <div class="flex flex-wrap gap-2 mt-auto pt-2 border-t border-slate-50 clickable-area">
                                    <a v-if="card.mapLink" :href="card.mapLink" target="_blank" @click.stop class="text-[10px] font-bold bg-red-50 text-red-500 px-2 py-1 rounded hover:bg-red-100 transition flex items-center gap-1 max-w-full truncate">
                                        <i class="fa-solid fa-location-dot"></i> {{ card.mapName || 'Google Maps' }}
                                    </a>
                                    <a v-if="card.url" :href="card.url" target="_blank" @click.stop class="text-[10px] font-bold bg-blue-50 text-blue-500 px-2 py-1 rounded hover:bg-blue-100 transition flex items-center gap-1 max-w-full truncate">
                                        <i class="fa-solid fa-link"></i> {{ card.urlName || '參考網頁' }}
                                    </a>
                                </div>
                            </div>
                        </div>
                        
                        <button v-if="clipboardCard" @click.stop="pasteCard(dIdx)" class="w-full py-2 bg-emerald-50 text-emerald-600 border-2 border-dashed border-emerald-200 rounded-xl hover:bg-emerald-100 font-bold transition-all shadow-sm mb-2 text-sm animate-in zoom-in duration-200">
                            <i class="fa-solid fa-paste mr-1"></i> 貼上「{{ clipboardCard.title }}」
                        </button>
                        
                        <button @click.stop="openCardModal(dIdx)" class="w-full py-4 border-2 border-dashed border-slate-200 text-slate-400 rounded-2xl hover:bg-white hover:text-blue-500 hover:border-blue-200 font-bold transition-all shadow-sm">
                            + 新增任務 / 景點
                        </button>
                    </div>
                </div>
                
                <button v-if="clipboardDay" @click.stop="pasteDay()" class="column flex flex-col items-center justify-center bg-emerald-50/80 border-2 border-dashed border-emerald-300 rounded-3xl text-emerald-600 hover:bg-emerald-100 hover:border-emerald-400 transition-all font-bold shadow-sm h-[200px] animate-in zoom-in duration-200">
                    <i class="fa-solid fa-paste text-3xl mb-2 drop-shadow-sm"></i>
                    <span>貼上整欄資料</span>
                    <span class="text-xs font-normal mt-1 truncate px-4 max-w-full">「{{ clipboardDay.date || '未命名' }}」</span>
                </button>

                <button @click.stop="addDay" class="column flex flex-col items-center justify-center bg-white/40 border-2 border-dashed border-slate-200 rounded-3xl text-slate-400 hover:bg-white hover:text-blue-500 hover:border-blue-200 transition-all font-bold shadow-sm h-[200px]">
                    <i class="fa-solid fa-plus-circle text-2xl mb-1"></i>
                    <span>新增區塊</span>
                </button>
            </main>

            <!-- 編輯視窗 -->
            <div v-if="showModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm" @click.stop="attemptCloseModal">
                <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in duration-200" @click.stop>
                    <div class="p-6 overflow-y-auto max-h-[85vh]">
                        <h2 class="text-xl font-black text-slate-800 mb-6 border-l-4 border-blue-600 pl-3">編輯細節</h2>
                        <div class="space-y-6">
                            <div>
                                <div class="flex flex-wrap gap-2">
                                    <button v-for="t in defaultTags" :key="t" @click="toggleTag(t)"
                                        :class="['px-3 py-1 rounded-lg text-xs font-bold transition-all border', 
                                                 form.tags.includes(t) ? getTagColor(t) + ' border-transparent shadow-sm' : 'bg-slate-50 text-slate-400 border-slate-200 hover:bg-slate-100']">
                                        {{ t }}
                                    </button>
                                    <button @click="addNewTag" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-sm">+ 自訂</button>
                                </div>
                            </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbwqzmka9Jgzdh54E_NjWDKruM1_beHY0gTvUhtt5IvWORPVnAied4zt2swJEK3l0crv/exec";
        const IMGBB_API_KEY = "4c98acba6c808fd9ac1815a2bd502e1f"; 
        const SECRET_PASSWORD = "cathy2026"; 

        /*
        @Author:      cathy_liu 劉詩敏
        @Date:        2026-09-13
        @Description: 多人協作三方合併 (3-way merge) 工具函式集 V1.12.0
                      解決「兩人同時編輯，整包覆寫互相蓋掉資料」的問題。
                      核心概念：
                      1. 每筆 trip / day / card 都有唯一 id，合併時用 id 比對「是不是同一筆」。
                      2. 每筆資料都有 updatedAt，兩邊都改到同一筆時，用時間較新的整筆蓋過去。
                      3. base = 上一次「已知與雲端一致」的快照，用來分辨
                         「這是新增的」還是「對方剛刪除的」。
        @Version:     V1.12.0
        */

        // 產生一個帶時間戳記的隨機唯一 id，不需要額外套件
        const genId = () => 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);

        // 深拷貝小工具（沿用專案原本就在用的 JSON.parse(JSON.stringify()) 手法）
        const cloneDeep = (obj) => JSON.parse(JSON.stringify(obj));

        // 標記一筆資料「剛剛被修改過」，合併時用來判斷誰的版本比較新
        const touch = (obj) => { if (obj) obj.updatedAt = Date.now(); };

        // 舊資料可能沒有 id / updatedAt（V1.11.3 以前建立的行程），讀取時自動補齊，向下相容
        const normalizeData = (data) => {
            if (!Array.isArray(data)) return data;
            data.forEach(trip => {
                if (!trip.id) trip.id = genId();
                if (!trip.updatedAt) trip.updatedAt = Date.now();
                (trip.days || []).forEach(day => {
                    if (!day.id) day.id = genId();
                    if (!day.updatedAt) day.updatedAt = Date.now();
                    (day.cards || []).forEach(card => {
                        if (!card.id) card.id = genId();
                        if (!card.updatedAt) card.updatedAt = Date.now();
                    });
                });
            });
            return data;
        };

        // 三方合併陣列核心邏輯：依 id 比對 base(合併基準) / local(本機) / remote(雲端最新)
        // mergeItem(baseItem, localItem, remoteItem)：同一個 id 兩邊都有時，如何合併其內容；
        // 省略時預設整筆用 updatedAt 較新的一方蓋過去
        const mergeArraysById = (baseArr, localArr, remoteArr, mergeItem) => {
            baseArr = baseArr || []; localArr = localArr || []; remoteArr = remoteArr || [];
            const baseIds = new Set(baseArr.map(i => i.id));
            const localMap = new Map(localArr.map(i => [i.id, i]));
            const remoteMap = new Map(remoteArr.map(i => [i.id, i]));

            // 排列順序：以雲端目前的順序為主，本機新增的項目補在最後面
            const order = [];
            remoteArr.forEach(i => { if (!order.includes(i.id)) order.push(i.id); });
            localArr.forEach(i => { if (!order.includes(i.id)) order.push(i.id); });

            const result = [];
            order.forEach(id => {
                const inLocal = localMap.has(id);
                const inRemote = remoteMap.has(id);
                const inBase = baseIds.has(id);

                if (inLocal && inRemote) {
                    // 兩邊都存在：可能雙方或其中一方有修改，交給 mergeItem 判斷內容
                    const baseItem = inBase ? baseArr.find(i => i.id === id) : null;
                    if (mergeItem) {
                        result.push(mergeItem(baseItem, localMap.get(id), remoteMap.get(id)));
                    } else {
                        const l = localMap.get(id), r = remoteMap.get(id);
                        result.push((l.updatedAt || 0) >= (r.updatedAt || 0) ? l : r);
                    }
                } else if (inLocal && !inRemote) {
                    // 只有本機有：base 也有 → 對方剛刪除了它，尊重刪除；base 沒有 → 是本機新增的，保留
                    if (!inBase) result.push(localMap.get(id));
                } else if (!inLocal && inRemote) {
                    // 只有雲端有：base 也有 → 是我方剛刪除的，尊重刪除；base 沒有 → 對方新增的，保留
                    if (!inBase) result.push(remoteMap.get(id));
                }
            });
            return result;
        };

        // 卡片層級：兩邊都改到同一張卡片時，整張卡片用 updatedAt 較新的一方為準
        const mergeCardLevel = (base, local, remote) => (local.updatedAt || 0) >= (remote.updatedAt || 0) ? local : remote;

        // 天(欄位)層級：欄位本身欄位(標題等)用較新的一方，裡面的卡片再往下一層合併
        const mergeDayLevel = (base, local, remote) => {
            const winner = (local.updatedAt || 0) >= (remote.updatedAt || 0) ? local : remote;
            const mergedCards = mergeArraysById(base ? base.cards : [], local.cards, remote.cards, mergeCardLevel);
            return { ...winner, cards: mergedCards };
        };

        // 行程層級：行程本身欄位(名稱等)用較新的一方，裡面的天再往下一層合併
        const mergeTripLevel = (base, local, remote) => {
            const winner = (local.updatedAt || 0) >= (remote.updatedAt || 0) ? local : remote;
            const mergedDays = mergeArraysById(base ? base.days : [], local.days, remote.days, mergeDayLevel);
            return { ...winner, days: mergedDays };
        };

        // 對外主要入口：合併整份「行程列表」(trips 陣列)
        const mergeTrips = (baseTrips, localTrips, remoteTrips) => {
            return mergeArraysById(baseTrips, localTrips, remoteTrips, mergeTripLevel);
        };

        createApp({
            setup() {
                const appVersion = ref('V1.12.1');
                const isLoggedIn = ref(false);
                const loginPassword = ref('');
                
                const trips = ref(normalizeData([{ id: genId(), updatedAt: Date.now(), name: '新增旅程', days: [{ id: genId(), updatedAt: Date.now(), date: 'Day 1', cards: [] }] }]));
                const activeTripIndex = ref(0);
                const loading = ref(false);
                const uploadingImage = ref(false);
                const loadingMsg = ref('同步中...');
                const showModal = ref(false);
                const isEditing = ref(false);
                const lastSyncTime = ref('--:--');
                // isSyncing：同步進行中的鎖，避免同一時間重複觸發合併/存檔造成競爭寫入
                const isSyncing = ref(false);
                // lastCloudSnapshot：上一次「已知與雲端一致」的資料快照，做為三方合併的比對基準(base)
                const lastCloudSnapshot = ref([]);
                
                const viewingImage = ref(null);
                const viewImage = (url) => { viewingImage.value = url; };
                const viewingDescCard = ref(null);
                const viewDesc = (card) => { viewingDescCard.value = card; };

                const activeDayMoveIdx = ref(null);
                const cardMoveModalPos = ref(null); 

                const tagColorMap = {
                    '機票': 'bg-sky-100 text-sky-700 border-sky-200',
                    '住宿': 'bg-indigo-100 text-indigo-700 border-indigo-200',
                    '交通': 'bg-emerald-100 text-emerald-700 border-emerald-200',
                    '美食': 'bg-orange-100 text-orange-700 border-orange-200',
                    '景點': 'bg-rose-100 text-rose-700 border-rose-200',
                    '購物': 'bg-fuchsia-100 text-fuchsia-700 border-fuchsia-200',
                    '注意': 'bg-amber-100 text-amber-700 border-amber-200',
                    '優惠卷': 'bg-violet-100 text-violet-700 border-violet-200'
                };
                
                const defaultTags = ref(Object.keys(tagColorMap));
                const form = ref({ title: '', desc: '', images: [], coverIndex: 0, mapLink: '', mapName: '', url: '', urlName: '', checklist: [], tags: [] });
                const tempImageUrl = ref(''); 
                
                const editingPos = ref({ day: 0, card: 0 });
                const dragInfo = ref({ type: null, dIdx: null, cIdx: null });
                const dragTripIndex = ref(null);
                
                const clipboardCard = ref(null); 
                const clipboardDay = ref(null);

                const currentTrip = computed(() => trips.value[activeTripIndex.value] || trips.value[0]);

                const getTagColor = (tag) => {
                    return tagColorMap[tag] || 'bg-slate-200 text-slate-700 border-slate-300';
                };

                const extractTags = () => {
                    const usedTags = new Set(Object.keys(tagColorMap));
                    trips.value.forEach(trip => {
                        trip.days.forEach(day => {
                            day.cards.forEach(card => {
                                if (card.tags && Array.isArray(card.tags)) {
                                    card.tags.forEach(t => usedTags.add(t));
                                }
                            });
                        });
                    });
                    defaultTags.value = Array.from(usedTags);
                };

                const copyCard = (cardData) => {
                    clipboardCard.value = JSON.parse(JSON.stringify(cardData));
                    clipboardDay.value = null; 
                };

                const copyDay = (dayData) => {
                    clipboardDay.value = JSON.parse(JSON.stringify(dayData));
                    clipboardCard.value = null; 
                };

                const pasteCard = (dayIdx) => {
                    if (clipboardCard.value) {
                        const newCard = JSON.parse(JSON.stringify(clipboardCard.value));
                        // 貼上會產生「新的一筆」，必須給全新 id，否則合併時會被誤判成同一張卡片
                        newCard.id = genId();
                        newCard.updatedAt = Date.now();
                        currentTrip.value.days[dayIdx].cards.push(newCard);
                        saveToCloud();
                        clipboardCard.value = null; 
                    }
                };

                const pasteDay = () => {
                    if (clipboardDay.value) {
                        const newDay = JSON.parse(JSON.stringify(clipboardDay.value));
                        // 整欄貼上：這個欄位本身、以及裡面每一張卡片都要換成全新 id
                        newDay.id = genId();
                        newDay.updatedAt = Date.now();
                        newDay.cards = (newDay.cards || []).map(c => ({ ...c, id: genId(), updatedAt: Date.now() }));
                        currentTrip.value.days.push(newDay); 
                        saveToCloud();
                        clipboardDay.value = null; 
                    }
                };

                const clearClipboard = () => {
                    if (clipboardCard.value) clipboardCard.value = null;
                    if (clipboardDay.value) clipboardDay.value = null;
                    activeDayMoveIdx.value = null;
                };

                const toggleDayMoveMenu = (idx) => {
                    activeDayMoveIdx.value = activeDayMoveIdx.value === idx ? null : idx;
                };

                const moveDayToPosition = (sourceIdx, targetIdx) => {
                    if (sourceIdx === targetIdx) return;
                    const movedDay = currentTrip.value.days.splice(sourceIdx, 1)[0];
                    currentTrip.value.days.splice(targetIdx, 0, movedDay);
                    activeDayMoveIdx.value = null;
                    saveToCloud();
                };

                const openCardMoveModal = (dIdx, cIdx) => {
                    cardMoveModalPos.value = { dIdx, cIdx };
                    activeDayMoveIdx.value = null; 
                };

                const moveCardToPosition = (targetIdx) => {
                    const { dIdx, cIdx: sourceIdx } = cardMoveModalPos.value;
                    if (sourceIdx === targetIdx) {
                        cardMoveModalPos.value = null;
                        return;
                    }
                    const movedCard = currentTrip.value.days[dIdx].cards.splice(sourceIdx, 1)[0];
                    currentTrip.value.days[dIdx].cards.splice(targetIdx, 0, movedCard);
                    cardMoveModalPos.value = null;
                    saveToCloud();
                };

                const editTripName = () => {
                    const newName = prompt('請輸入新的行程名稱：', currentTrip.value.name);
                    if (newName && newName.trim() !== '') {
                        currentTrip.value.name = newName.trim();
                        touch(currentTrip.value);
                        saveToCloud();
                    }
                };

                const deleteTrip = () => {
                    const pwd = prompt(`請輸入密碼以確認刪除行程「${currentTrip.value.name}」：`);
                    if (pwd === SECRET_PASSWORD) {
                        if (confirm(`⚠️ 警告！確定要永久刪除「${currentTrip.value.name}」嗎？此動作無法復原！`)) {
                            trips.value.splice(activeTripIndex.value, 1);
                            if (trips.value.length === 0) {
                                trips.value.push({ name: '新旅程', days: [{ date: 'Day 1', cards: [] }] });
                            }
                            activeTripIndex.value = 0; 
                            saveToCloud();
                        }
                    } else if (pwd !== null) {
                        alert('密碼錯誤，刪除操作已取消。');
                    }
                };

                /*
                @Author:      cathy_liu 劉詩敏
                @Date:        2026-09-13
                @Description: handleLogin V1.12.1（修補舊資料 id 遷移風險）
                              問題：V1.12.0 以前建立的舊資料沒有 id/updatedAt，
                              normalizeData() 每次遇到缺 id 的資料都會「隨機」補一個新 id。
                              如果登入時補了一組 id，但雲端還沒被寫回過，下一次背景抓取／
                              存檔又對「同一份雲端舊資料」重新 normalize 一次，就會產生
                              「另一組不同的隨機 id」，導致三方合併誤判成「舊資料被刪除、
                              新增了內容一樣的新資料」，把過渡期間剛做的編輯洗掉。
                              修法：偵測到資料是舊格式時，登入當下就立刻把補好 id 的版本
                              寫回雲端一次，之後每次抓取看到的都是「同一組 id」，徹底避免
                              這個過渡期的競爭風險。
                @Version:     V1.12.1
                */
                // 檢查抓回來的原始資料是不是 V1.12.0 之前的舊格式（缺少 id）
                const needsIdMigration = (rawTrips) => {
                    if (!Array.isArray(rawTrips)) return false;
                    return rawTrips.some(trip => !trip.id ||
                        (trip.days || []).some(day => !day.id ||
                            (day.cards || []).some(card => !card.id)));
                };

                const handleLogin = async () => {
                    if (!loginPassword.value) return alert('請輸入密碼');
                    loading.value = true;
                    try {
                        const res = await fetch(`${CLOUD_API_URL}?pwd=${loginPassword.value}`);
                        const data = await res.json();
                        if (data.error) { alert('密碼錯誤！'); loginPassword.value = ''; } 
                        else { 
                            isLoggedIn.value = true; 
                            if (Array.isArray(data) && data.length > 0) {
                                const migrationNeeded = needsIdMigration(data);
                                trips.value = normalizeData(data);
                                extractTags();
                                // 記錄登入當下的狀態，做為之後三方合併的初始基準
                                lastCloudSnapshot.value = cloneDeep(trips.value);

                                if (migrationNeeded) {
                                    // 舊格式資料：立刻把補好 id 的版本寫回雲端，避免之後
                                    // 每次重新抓取都各自產生不同的隨機 id 造成誤判刪除
                                    try {
                                        await fetch(`${CLOUD_API_URL}?pwd=${loginPassword.value}`, {
                                            method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain"},
                                            body: JSON.stringify(trips.value)
                                        });
                                    } catch (migrateErr) { console.error('舊資料 id 補齊回寫失敗：', migrateErr); }
                                }
                            } else {
                                trips.value = normalizeData(trips.value);
                                lastCloudSnapshot.value = cloneDeep(trips.value);
                            }
                        }
                    } catch (e) { alert('連線失敗'); } finally { loading.value = false; }
                };

                const linkify = (text) => {
                    if (!text) return '';
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    let safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    safeText = safeText.replace(urlRegex, (url) => `<a href="${url}" target="_blank" class="text-blue-500 font-bold underline" onclick="event.stopPropagation()">${url}</a>`);
                    return safeText.split('\n').join('<br/>');
                };

                const handleDragStart = (type, dIdx, cIdx, event) => {
                    dragInfo.value = { type, dIdx, cIdx };
                    event.dataTransfer.effectAllowed = 'move';
                    setTimeout(() => event.target.classList.add('dragging-ghost'), 0);
                };
                const handleDragEnd = (event) => {
                    event.target.classList.remove('dragging-ghost');
                    dragInfo.value = { type: null, dIdx: null, cIdx: null };
                };
                const handleDrop = (targetType, targetDIdx, targetCIdx) => {
                    const { type, dIdx, cIdx } = dragInfo.value;
                    if (!type || type !== targetType) return;
                    if (type === 'day') {
                        if (dIdx === targetDIdx) return;
                        const movedDay = currentTrip.value.days.splice(dIdx, 1)[0];
                        currentTrip.value.days.splice(targetDIdx, 0, movedDay);
                    } else if (type === 'card') {
                        if (dIdx === targetDIdx && cIdx === targetCIdx) return;
                        const movedCard = currentTrip.value.days[dIdx].cards.splice(cIdx, 1)[0];
                        if (targetCIdx !== null) currentTrip.value.days[targetDIdx].cards.splice(targetCIdx, 0, movedCard);
                        else currentTrip.value.days[targetDIdx].cards.push(movedCard);
                    }
                    saveToCloud();
                };

                const handleTripDragStart = (index, event) => {
                    dragTripIndex.value = index;
                    event.dataTransfer.effectAllowed = 'move';
                    setTimeout(() => event.target.classList.add('opacity-50'), 0);
                };
                const handleTripDragEnd = (event) => {
                    event.target.classList.remove('opacity-50');
                    dragTripIndex.value = null;
                };
                const handleTripDrop = (targetIndex) => {
                    const sourceIndex = dragTripIndex.value;
                    if (sourceIndex === null || sourceIndex === targetIndex) return;
                    const activeTripObj = trips.value[activeTripIndex.value];
                    const movedTrip = trips.value.splice(sourceIndex, 1)[0];
                    trips.value.splice(targetIndex, 0, movedTrip);
                    activeTripIndex.value = trips.value.indexOf(activeTripObj);
                    saveToCloud();
                };

                const uploadToImgbb = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    uploadingImage.value = true;
                    loadingMsg.value = '上傳圖床中...';
                    loading.value = true;
                    const formData = new FormData();
                    formData.append('image', file);
                    try {
                        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                        const data = await response.json();
                        if (data.success) { 
                            form.value.images.push(data.data.url); 
                        } else { alert("圖片上傳失敗：" + data.error.message); }
                    } catch (err) { alert("無法連線至圖床"); } 
                    finally { uploadingImage.value = false; loading.value = false; loadingMsg.value = '同步中...'; e.target.value = ''; }
                };

                const addManualImage = () => {
                    if (tempImageUrl.value.trim()) {
                        form.value.images.push(tempImageUrl.value.trim());
                        tempImageUrl.value = '';
                    }
                };

                const removeImage = (idx) => {
                    form.value.images.splice(idx, 1);
                    if (form.value.coverIndex >= form.value.images.length) {
                        form.value.coverIndex = Math.max(0, form.value.images.length - 1);
                    }
                };

                const getDirectImageUrl = (url) => {
                    if (!url) return '';
                    const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^\/]+)/);
                    if (driveMatch) return `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
                    return url;
                };
                const handleImageError = (e) => { e.target.style.display = 'none'; };

                /*
                @Author:      cathy_liu 劉詩敏
                @Date:        2026-09-13
                @Description: fetchFromCloud V1.12.0
                              背景/手動抓取雲端資料時，不再直接整包覆蓋本機，而是用
                              base(上次同步基準)／local(本機目前)／remote(雲端最新)
                              做三方合併，避免蓋掉本機尚未來得及送出的修改。
                              若合併後結果跟雲端原始資料不同（代表本機有新東西），
                              會自動補寫回雲端，讓雲端保持最新的合併結果。
                @Version:     V1.12.0
                */
                const fetchFromCloud = async () => {
                    // 若正在載入、同步中、或是開啟編輯視窗中，則暫停背景同步，避免打斷編輯或造成競爭寫入
                    if (loading.value || showModal.value || isSyncing.value || !isLoggedIn.value) return;
                    isSyncing.value = true;
                    loading.value = true;
                    loadingMsg.value = '抓取中...';
                    try {
                        const res = await fetch(`${CLOUD_API_URL}?pwd=${loginPassword.value}`);
                        const data = await res.json();
                        if (!data.error && Array.isArray(data)) {
                            const remoteTrips = normalizeData(data);
                            const merged = mergeTrips(lastCloudSnapshot.value, trips.value, remoteTrips);
                            trips.value = merged;
                            extractTags();

                            // 合併後跟雲端原始資料不一樣，代表本機有雲端還不知道的修改，補寫回去
                            if (JSON.stringify(merged) !== JSON.stringify(remoteTrips)) {
                                await fetch(`${CLOUD_API_URL}?pwd=${loginPassword.value}`, {
                                    method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain"},
                                    body: JSON.stringify(merged)
                                });
                                lastCloudSnapshot.value = cloneDeep(merged);
                            } else {
                                lastCloudSnapshot.value = cloneDeep(remoteTrips);
                            }
                        }
                        lastSyncTime.value = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    } catch (e) { console.error(e); } finally { loading.value = false; isSyncing.value = false; }
                };

                /*
                @Author:      cathy_liu 劉詩敏
                @Date:        2026-09-13
                @Description: saveToCloud V1.12.0
                              存檔前先抓一次雲端最新資料，確認同一時間有沒有其他人已經
                              送出變更，再用三方合併算出最終結果後才寫回雲端，
                              取代原本「直接整包覆蓋」的做法，避免互相蓋掉對方的修改。
                @Version:     V1.12.0
                */
                const saveToCloud = async () => {
                    // 已經在同步中就先跳過這一次，避免同時間重複送出造成競爭寫入；
                    // 呼叫端的資料變動仍留在 trips.value 上，下一次操作觸發存檔時會一併存到
                    if (isSyncing.value) return;
                    isSyncing.value = true;
                    loading.value = true;
                    loadingMsg.value = '同步比對中...';
                    try {
                        // Step 1：存檔前先抓一次雲端最新資料
                        const res = await fetch(`${CLOUD_API_URL}?pwd=${loginPassword.value}`);
                        const remoteData = await res.json();
                        const remoteTrips = (!remoteData.error && Array.isArray(remoteData))
                            ? normalizeData(remoteData)
                            : lastCloudSnapshot.value;

                        // Step 2：以上次同步基準(base)為準，合併本機修改(local)與雲端最新(remote)
                        const merged = mergeTrips(lastCloudSnapshot.value, trips.value, remoteTrips);
                        trips.value = merged;
                        extractTags();

                        // Step 3：把合併後的最終結果寫回雲端
                        loadingMsg.value = '寫入雲端中...';
                        await fetch(`${CLOUD_API_URL}?pwd=${loginPassword.value}`, { 
                            method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain"},
                            body: JSON.stringify(merged) 
                        });

                        // Step 4：更新合併基準快照，做為下一次三方合併的 base
                        lastCloudSnapshot.value = cloneDeep(merged);
                        lastSyncTime.value = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    } catch (e) {
                        console.error('存檔合併失敗：', e);
                    } finally {
                        loading.value = false;
                        isSyncing.value = false;
                    }
                };

                const openCardModal = (dayIdx) => {
                    isEditing.value = false;
                    editingPos.value.day = dayIdx;
                    form.value = { title: '', desc: '', images: [], coverIndex: 0, mapLink: '', mapName: '', url: '', urlName: '', checklist: [], tags: [] };
                    tempImageUrl.value = '';
                    showModal.value = true;
                };

                const editCard = (dayIdx, cardIdx) => {
                    isEditing.value = true;
                    editingPos.value = { day: dayIdx, card: cardIdx };
                    const rawData = JSON.parse(JSON.stringify(currentTrip.value.days[dayIdx].cards[cardIdx]));
                    
                    if (rawData.image && (!rawData.images || rawData.images.length === 0)) {
                        rawData.images = [rawData.image];
                    }
                    if (!rawData.images) rawData.images = [];
                    if (typeof rawData.coverIndex === 'undefined') rawData.coverIndex = 0;
                    if (!rawData.checklist) rawData.checklist = [];
                    if (!rawData.tags) rawData.tags = [];
                    
                    form.value = rawData;
                    tempImageUrl.value = '';
                    showModal.value = true;
                };

                const saveCard = () => {
                    if (!form.value.title) return alert('請輸入標題');
                    const cardData = JSON.parse(JSON.stringify(form.value));
                    cardData.updatedAt = Date.now();
                    if (isEditing.value) {
                        if (!cardData.id) cardData.id = genId(); // 保護：舊資料萬一沒有 id 時補上
                        currentTrip.value.days[editingPos.value.day].cards[editingPos.value.card] = cardData;
                    } else {
                        cardData.id = genId();
                        currentTrip.value.days[editingPos.value.day].cards.push(cardData);
                    }
                    
                    extractTags(); 
                    showModal.value = false;
                    saveToCloud();
                };

                const attemptCloseModal = () => {
                    if (confirm('確定要放棄目前編輯的內容嗎？尚未儲存的資料將會遺失。')) {
                        showModal.value = false;
                    }
                };

                const removeCard = (d, c) => { if(confirm('確定刪除？')) { touch(currentTrip.value.days[d]); currentTrip.value.days[d].cards.splice(c, 1); saveToCloud(); }};
                const createNewTrip = () => { const n = prompt('行程名稱？'); if(n){ trips.value.push({id: genId(), updatedAt: Date.now(), name:n, days:[{id: genId(), updatedAt: Date.now(), date:'Day 1', cards:[]}]}); saveToCloud(); }};
                const addDay = () => { touch(currentTrip.value); currentTrip.value.days.push({id: genId(), updatedAt: Date.now(), date:'新欄位', cards:[]}); saveToCloud(); };
                const removeDay = (idx) => { if(confirm('刪除整欄？')) { touch(currentTrip.value); currentTrip.value.days.splice(idx,1); saveToCloud(); }};

                const toggleTag = (tag) => {
                    if (!form.value.tags) form.value.tags = [];
                    const idx = form.value.tags.indexOf(tag);
                    if (idx > -1) form.value.tags.splice(idx, 1);
                    else form.value.tags.push(tag);
                };
                
                const addNewTag = () => {
                    const t = prompt("標籤名稱");
                    if (t && !defaultTags.value.includes(t)) {
                        defaultTags.value.push(t);
                    }
                };

                onMounted(() => {
                    // 基礎的 25 秒定期同步（V1.12.0 由 40 秒縮短，搭配三方合併降低多人衝突視窗）
                    setInterval(() => {
                        if (isLoggedIn.value && !showModal.value) fetchFromCloud(); 
                    }, 25000);

                    // ★ 新增：當視窗重新獲得焦點或切換回此分頁時，立刻觸發積極同步 ★
                    const aggressiveSync = () => {
                        if (isLoggedIn.value && !showModal.value && !isEditing.value) {
                            fetchFromCloud();
                        }
                    };

                    window.addEventListener('focus', aggressiveSync);
                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'visible') {
                            aggressiveSync();
                        }
                    });

                    window.addEventListener('click', () => {
                        if (clipboardCard.value) clipboardCard.value = null;
                        if (clipboardDay.value) clipboardDay.value = null;
                        activeDayMoveIdx.value = null;
                    });

                    window.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') {
                            clipboardCard.value = null;
                            clipboardDay.value = null;
                            viewingImage.value = null;
                            viewingDescCard.value = null;
                            activeDayMoveIdx.value = null;
                            cardMoveModalPos.value = null;
                            
                            if (showModal.value) {
                                attemptCloseModal();
                            }
                        }
                    });
                });

                return {
                    appVersion, isLoggedIn, loginPassword, handleLogin,
                    trips, activeTripIndex, currentTrip, loading, loadingMsg, uploadingImage, showModal, isEditing, form, tempImageUrl, lastSyncTime, defaultTags,
                    linkify, getTagColor,
                    clipboardCard, copyCard, pasteCard, 
                    clipboardDay, copyDay, pasteDay, 
                    clearClipboard, attemptCloseModal, 
                    viewingImage, viewImage, viewingDescCard, viewDesc,
                    editTripName, deleteTrip,
                    toggleDayMoveMenu, moveDayToPosition, activeDayMoveIdx,
                    cardMoveModalPos, openCardMoveModal, moveCardToPosition, 
                    uploadToImgbb, addManualImage, removeImage, fetchFromCloud, saveToCloud, openCardModal, editCard, saveCard, removeCard, createNewTrip, addDay, removeDay, toggleTag, addNewTag, getDirectImageUrl, handleImageError,
                    handleDragStart, handleDragEnd, handleDrop,
                    handleTripDragStart, handleTripDragEnd, handleTripDrop
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
