<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅遊規劃 - 診斷測試版</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .column { min-width: 320px; max-width: 320px; height: calc(100vh - 180px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">
    <div id="app" class="h-screen flex flex-col">
        <header class="bg-red-800 text-white p-4 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <h1 class="font-bold tracking-tighter italic text-xl">DEBUG MODE</h1>
                <div class="flex gap-2">
                    <button @click="fetchFromCloud" class="p-2 bg-red-700 rounded-full" title="手動同步">
                        <i class="fa-solid fa-sync" :class="{'fa-spin': loading}"></i>
                    </button>
                    <button @click="createNewTrip" class="bg-white text-red-800 px-3 py-1 rounded font-bold">+ 行程</button>
                </div>
            </div>
            <div class="text-[10px] opacity-80">
                API 網址: <span class="bg-black/20 px-1 rounded">{{ apiUrl.substring(0, 40) }}...</span>
            </div>
        </header>

        <main class="flex-1 overflow-x-auto p-4 flex gap-4">
            <div v-for="(day, dIdx) in currentTrip.days" :key="dIdx" class="column flex flex-col bg-white/80 border rounded-3xl">
                <div class="p-4 border-b flex justify-between">
                    <input v-model="day.date" class="font-bold outline-none bg-transparent">
                    <button @click="removeDay(dIdx)" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-4">
                    <div v-for="(card, cIdx) in day.cards" :key="cIdx" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 group">
                        <img v-if="card.image" :src="card.image" class="w-full h-32 object-contain bg-black rounded-lg mb-2">
                        <div class="flex justify-between font-bold text-slate-700">
                            <span>{{ card.title }}</span>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100">
                                <button @click="editCard(dIdx, cIdx)" class="text-blue-500"><i class="fa-solid fa-pen"></i></button>
                                <button @click="removeCard(dIdx, cIdx)" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                    <button @click="openCardModal(dIdx)" class="w-full py-4 border-2 border-dashed border-slate-200 text-slate-300 rounded-xl font-bold">+ 新增</button>
                </div>
            </div>
            <button @click="addDay" class="px-10 bg-white/50 border-2 border-dashed border-slate-200 rounded-3xl font-bold">新增欄位</button>
        </main>

        <div v-if="showModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
            <div class="bg-white w-full max-w-md rounded-2xl p-6">
                <h2 class="font-bold text-lg mb-4 text-red-800">編輯測試</h2>
                <div class="space-y-4">
                    <input v-model="form.title" class="w-full border-b p-2 outline-none focus:border-red-800" placeholder="標題 *">
                    <div class="bg-red-50 p-3 rounded-lg border border-red-100">
                        <label class="text-[10px] font-bold text-red-400">圖片網址</label>
                        <input v-model="form.image" class="w-full text-xs p-1 outline-none mt-1" placeholder="https://...">
                    </div>
                    <button @click="saveCard" class="w-full py-3 bg-red-800 text-white font-bold rounded-xl shadow-lg">確認並儲存</button>
                    <button @click="showModal = false" class="w-full py-2 text-slate-400 text-sm">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbwqzmka9Jgzdh54E_NjWDKruM1_beHY0gTvUhtt5IvWORPVnAied4zt2swJEK3l0crv/exec";

        createApp({
            setup() {
                const trips = ref([{ name: '瑞士行', days: [{ date: '2026/02/14', cards: [] }] }]);
                const activeTripIndex = ref(0);
                const loading = ref(false);
                const showModal = ref(false);
                const isEditing = ref(false);
                const form = ref({ title: '', image: '', checklist: [], tags: [] });
                const editingPos = ref({ day: 0, card: 0 });

                const currentTrip = computed(() => trips.value[activeTripIndex.value] || trips.value[0]);

                const fetchFromCloud = async () => {
                    loading.value = true;
                    try {
                        const res = await fetch(CLOUD_API_URL);
                        const data = await res.json();
                        if (Array.isArray(data)) {
                            trips.value = data;
                            console.log("資料抓取成功");
                        }
                    } catch (e) { alert("抓取失敗: " + e); }
                    finally { loading.value = false; }
                };

                const saveToCloud = async () => {
                    loading.value = true;
                    try {
                        const jsonStr = JSON.stringify(trips.value);
                        // 注意：這裡使用 POST。請確保 GAS 的部署權限是「所有人」。
                        await fetch(CLOUD_API_URL, { 
                            method: "POST", 
                            mode: "no-cors", 
                            body: jsonStr 
                        });
                        console.log("已送出存檔請求，請確認試算表是否有變化");
                    } catch (e) { alert("儲存失敗: " + e); }
                    finally { loading.value = false; }
                };

                const openCardModal = (dayIdx) => {
                    isEditing.value = false;
                    editingPos.value.day = dayIdx;
                    form.value = { title: '', image: '', checklist: [], tags: [] };
                    showModal.value = true;
                };

                const editCard = (dayIdx, cardIdx) => {
                    isEditing.value = true;
                    editingPos.value = { day: dayIdx, card: cardIdx };
                    form.value = JSON.parse(JSON.stringify(currentTrip.value.days[dayIdx].cards[cardIdx]));
                    showModal.value = true;
                };

                const saveCard = () => {
                    if (!form.value.title) return;
                    if (isEditing.value) currentTrip.value.days[editingPos.value.day].cards[editingPos.value.card] = { ...form.value };
                    else currentTrip.value.days[editingPos.value.day].cards.push({ ...form.value });
                    showModal.value = false;
                    saveToCloud(); // 儲存後不自動 fetch，方便觀察資料是否消失
                };

                const removeCard = (d, c) => { currentTrip.value.days[d].cards.splice(c, 1); saveToCloud(); };
                const createNewTrip = () => { const n = prompt('名稱？'); if(n){ trips.value.push({name:n, days:[{date:'Day 1', cards:[]}]}); saveToCloud(); }};
                const addDay = () => { currentTrip.value.days.push({date:'新欄位', cards:[]}); saveToCloud(); };
                const removeDay = (idx) => { if(confirm('刪除？')) { currentTrip.value.days.splice(idx,1); saveToCloud(); }};

                onMounted(() => {
                    fetchFromCloud();
                    // 暫時關閉 setInterval 自動同步，改為完全手動控制
                });

                return {
                    apiUrl: CLOUD_API_URL, trips, activeTripIndex, currentTrip, loading, showModal, isEditing, form,
                    fetchFromCloud, saveToCloud, openCardModal, editCard, saveCard, removeCard, createNewTrip, addDay, removeDay
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
