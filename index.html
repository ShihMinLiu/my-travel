<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的旅遊行程規劃</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .column { min-width: 320px; max-width: 320px; height: calc(100vh - 180px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* 修正圖片顯示，object-contain 確保看得到整張圖 */
        .img-preview { width: 100%; height: 200px; object-fit: contain; background: #000; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="app" class="h-screen flex flex-col">
        <header class="bg-gradient-to-r from-blue-900 to-indigo-950 text-white p-4 shadow-xl flex-none">
            <div class="flex justify-between items-center mb-3">
                <div class="flex flex-col">
                    <h1 class="text-xl font-black italic tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-plane-up"></i> TRAVEL PLANNER
                    </h1>
                    <span class="text-[10px] text-blue-200">最後同步: {{ lastSyncTime }}</span>
                </div>
                <div class="flex items-center gap-2">
                    <div v-if="loading" class="text-[10px] bg-white/20 px-2 py-1 rounded-full animate-pulse">雲端同步中...</div>
                    <button @click="fetchFromCloud" class="p-2 hover:bg-white/10 rounded-full transition"><i class="fa-solid fa-sync"></i></button>
                    <button @click="createNewTrip" class="bg-blue-500 hover:bg-blue-400 text-white font-bold px-3 py-1 rounded-lg text-sm shadow transition">+ 新行程</button>
                </div>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button v-for="(trip, index) in trips" :key="index" @click="activeTripIndex = index"
                    :class="['px-5 py-1.5 rounded-full text-sm whitespace-nowrap transition-all', 
                             activeTripIndex === index ? 'bg-white text-blue-900 font-bold shadow-md' : 'bg-white/10 text-blue-100 hover:bg-white/20']">
                    {{ trip.name }}
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-x-auto p-6 flex gap-6">
            <div v-for="(day, dIdx) in currentTrip.days" :key="dIdx" class="column flex flex-col bg-slate-200/50 rounded-3xl border border-slate-200 shadow-sm">
                <div class="p-4 flex justify-between items-center border-b border-slate-100/50">
                    <input v-model="day.date" @blur="saveToCloud" class="bg-transparent font-black text-slate-700 w-full focus:outline-none text-lg">
                    <button @click="removeDay(dIdx)" class="text-slate-400 hover:text-red-500 transition"><i class="fa-solid fa-trash-can text-sm"></i></button>
                </div>

                <div class="flex-1 overflow-y-auto px-4 pb-4 space-y-4 pt-3">
                    <div v-for="(card, cIdx) in day.cards" :key="cIdx" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden group hover:shadow-lg transition-shadow">
                        <img v-if="card.image && card.showImage" :src="card.image" class="img-preview" @error="handleImageError(card)">
                        
                        <div class="p-4">
                            <div class="flex flex-wrap gap-1 mb-2">
                                <span v-for="tag in card.tags" :key="tag" class="text-[9px] px-2 py-0.5 rounded bg-blue-50 text-blue-600 font-bold uppercase">{{ tag }}</span>
                            </div>
                            
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-slate-800 leading-tight flex-1 pr-2">{{ card.title }}</h3>
                                <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                                    <button @click="editCard(dIdx, cIdx)" class="text-slate-400 hover:text-blue-600"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button @click="removeCard(dIdx, cIdx)" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                                }
                            </div>
                            
                            <p v-if="card.desc" class="text-xs text-slate-500 mb-3 line-clamp-2">{{ card.desc }}</p>

                            <div v-if="card.checklist && card.checklist.length" class="mb-3 space-y-1 bg-slate-50 p-2 rounded-xl border border-slate-100">
                                <div v-for="(item, iIdx) in card.checklist" :key="iIdx" class="flex items-center gap-2 text-[10px]">
                                    <input type="checkbox" v-model="item.done" @change="saveToCloud" class="rounded h-3 w-3 text-blue-600 border-slate-300">
                                    <span :class="{'line-through text-slate-400': item.done}" class="text-slate-600 truncate">{{ item.text }}</span>
                                </div>
                            </div>

                            <div class="flex gap-3 mt-auto pt-2 border-t border-slate-50">
                                <a v-if="card.mapLink" :href="card.mapLink" target="_blank" class="text-red-500 hover:scale-110 transition"><i class="fa-solid fa-location-dot"></i></a>
                                <a v-if="card.url" :href="card.url" target="_blank" class="text-blue-500 hover:scale-110 transition"><i class="fa-solid fa-link"></i></a>
                            </div>
                        </div>
                    </div>
                    <button @click="openCardModal(dIdx)" class="w-full py-4 border-2 border-dashed border-slate-200 text-slate-300 rounded-2xl hover:bg-white hover:text-blue-500 font-bold transition-all">+ 新增項目 / 景點</button>
                </div>
            </div>
            <button @click="addDay" class="column flex flex-col items-center justify-center bg-white/40 border-2 border-dashed border-slate-200 rounded-3xl text-slate-400 hover:bg-white hover:text-blue-500 transition-all font-bold">
                <i class="fa-solid fa-plus-circle text-2xl mb-1"></i>
                <span>新增欄位</span>
            </button>
        </main>

        <div v-if="showModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">
            <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in duration-200">
                <div class="p-6 overflow-y-auto max-h-[85vh]">
                    <h2 class="text-xl font-black text-slate-800 mb-6 border-l-4 border-blue-600 pl-3">編輯細節</h2>
                    <div class="space-y-6">
                        <div>
                            <div class="flex flex-wrap gap-2">
                                <button v-for="t in defaultTags" :key="t" @click="toggleTag(t)"
                                    :class="['px-3 py-1 rounded-lg text-xs font-bold transition-all', form.tags.includes(t) ? 'bg-blue-600 text-white shadow' : 'bg-slate-100 text-slate-500']">{{ t }}</button>
                                <button @click="addNewTag" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-white">+ 自訂</button>
                            </div>
                        </div>

                        <input v-model="form.title" class="w-full border-b-2 border-slate-100 p-2 font-bold focus:border-blue-500 outline-none text-lg" placeholder="景點或任務名稱 *">

                        <div class="bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                            <div class="flex justify-between items-center mb-3">
                                <label class="text-[10px] font-black text-blue-500 uppercase tracking-widest">檢查清單</label>
                                <button @click="form.checklist.push({text:'', done:false})" class="text-[10px] font-bold text-white bg-blue-500 px-3 py-1 rounded-full hover:bg-blue-600 transition shadow-sm">+ 新增</button>
                            </div>
                            <div class="space-y-2">
                                <div v-for="(item, i) in form.checklist" :key="i" class="flex gap-2 items-center">
                                    <input type="checkbox" v-model="item.done" class="rounded h-4 w-4 text-blue-600 border-slate-300">
                                    <input v-model="item.text" class="flex-1 bg-white border border-slate-200 rounded-lg p-2 text-xs focus:ring-1 ring-blue-100 outline-none" placeholder="做什麼呢？">
                                    <button @click="form.checklist.splice(i, 1)" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-minus-circle text-sm"></i></button>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-2xl border-2 border-dashed border-slate-200">
                            <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">圖片網址 (支援 Google Drive 連結)</label>
                            <input v-model="form.image" class="w-full bg-white border border-slate-200 rounded-xl p-3 text-xs outline-none focus:ring-2 ring-blue-100" placeholder="貼上照片 URL (jpg/png) 或 Google Drive 分享連結">
                            
                            <div v-if="form.image" class="mt-3 relative rounded-xl overflow-hidden border shadow-sm">
                                <img :src="getDirectImageUrl(form.image)" class="w-full h-32 object-contain bg-black" @error="handleImageError(form)">
                                <label class="absolute top-2 left-2 bg-black/50 text-white px-2 py-1 rounded text-[10px] cursor-pointer flex items-center gap-1">
                                    <input type="checkbox" v-model="form.showImage"> 顯示在封面
                                </label>
                            </div>
                        </div>

                        <textarea v-model="form.desc" class="w-full bg-slate-50 rounded-2xl p-4 text-sm h-20 outline-none border-2 border-transparent focus:border-blue-50" placeholder="補充詳細描述..."></textarea>
                        
                        <div class="grid grid-cols-2 gap-3 text-xs">
                            <input v-model="form.mapLink" class="bg-slate-50 p-3 rounded-xl outline-none" placeholder="Google Maps 連結">
                            <input v-model="form.url" class="bg-slate-50 p-3 rounded-xl outline-none" placeholder="參考網址連結">
                        </div>
                    </div>
                </div>
                <div class="p-6 bg-slate-50 flex gap-4">
                    <button @click="showModal = false" class="flex-1 py-4 text-slate-500 font-bold hover:bg-slate-200 rounded-2xl transition">取消</button>
                    <button @click="saveCard" class="flex-1 py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-xl hover:bg-blue-700 transition" :disabled="loading">
                        {{ loading ? '同步中...' : '確認儲存' }}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        // 使用你的 Google Script URL
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbwqzmka9Jgzdh54E_NjWDKruM1_beHY0gTvUhtt5IvWORPVnAied4zt2swJEK3l0crv/exec";

        createApp({
            setup() {
                const trips = ref([{ name: '我的旅程', days: [{ date: 'Day 1', cards: [] }] }]);
                const activeTripIndex = ref(0);
                const loading = ref(false);
                const showModal = ref(false);
                const isEditing = ref(false);
                const lastSyncTime = ref('--:--');
                const defaultTags = ref(['交通', '美食', '景點', '購物']);
                const form = ref({ title: '', desc: '', image: '', showImage: true, mapLink: '', url: '', checklist: [], tags: [] });
                const editingPos = ref({ day: 0, card: 0 });

                const currentTrip = computed(() => trips.value[activeTripIndex.value] || trips.value[0]);

                // 核心修復：自動將 Google Drive 分享連結轉換為直接圖片連結
                const getDirectImageUrl = (url) => {
                    if (!url) return '';
                    // 偵測是否為 Google Drive 連結模式
                    const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^\/]+)/);
                    if (driveMatch) {
                        return `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
                    }
                    return url; // 如果不是 Drive 連結，直接返回原本網址
                };

                const handleImageError = (cardOrForm) => {
                    // 如果圖片讀取失敗 (比如網址填錯、或者權限沒開)，將圖片路徑設為空，隱藏區塊。
                    cardOrForm.image = '';
                };

                const fetchFromCloud = async () => {
                    if (loading.value || showModal.value) return;
                    loading.value = true;
                    try {
                        const res = await fetch(CLOUD_API_URL);
                        const data = await res.json();
                        if (Array.isArray(data)) trips.value = data;
                        lastSyncTime.value = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    } catch (e) { console.error(e); } finally { loading.value = false; }
                };

                const saveToCloud = async () => {
                    loading.value = true;
                    try {
                        await fetch(CLOUD_API_URL, { 
                            method: "POST", 
                            mode: "no-cors", 
                            headers: {"Content-Type": "text/plain"},
                            body: JSON.stringify(trips.value) 
                        });
                        setTimeout(() => { loading.value = false; lastSyncTime.value = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }, 1000);
                    } catch (e) { loading.value = false; }
                };

                const openCardModal = (dayIdx) => {
                    isEditing.value = false;
                    editingPos.value.day = dayIdx;
                    form.value = { title: '', desc: '', image: '', showImage: true, mapLink: '', url: '', checklist: [], tags: [] };
                    showModal.value = true;
                };

                const editCard = (dayIdx, cardIdx) => {
                    isEditing.value = true;
                    editingPos.value = { day: dayIdx, card: cardIdx };
                    const rawData = JSON.parse(JSON.stringify(currentTrip.value.days[dayIdx].cards[cardIdx]));
                    if (!rawData.checklist) rawData.checklist = [];
                    if (!rawData.tags) rawData.tags = [];
                    if (rawData.showImage === undefined) rawData.showImage = true;
                    form.value = rawData;
                    showModal.value = true;
                };

                const saveCard = () => {
                    if (!form.value.title) return alert('請輸入標題');
                    
                    // 在儲存前，將表單輸入的網址轉換為可以直接顯示圖片的連結
                    const finalImageUrl = getDirectImageUrl(form.value.image);
                    
                    if (isEditing.value) {
                        currentTrip.value.days[editingPos.value.day].cards[editingPos.value.card] = { ...form.value, image: finalImageUrl };
                    } else {
                        currentTrip.value.days[editingPos.value.day].cards.push({ ...form.value, image: finalImageUrl });
                    }
                    showModal.value = false;
                    saveToCloud();
                };

                const removeCard = (d, c) => { if(confirm('確定刪除？')) { currentTrip.value.days[d].cards.splice(c, 1); saveToCloud(); }};
                const createNewTrip = () => { const n = prompt('行程名稱？'); if(n){ trips.value.push({name:n, days:[{date:'Day 1', cards:[]}]}); saveToCloud(); }};
                const addDay = () => { currentTrip.value.days.push({date:'新日期', cards:[]}); saveToCloud(); };
                const removeDay = (idx) => { if(confirm('刪除整欄？')) { currentTrip.value.days.splice(idx,1); saveToCloud(); }};

                const toggleTag = (tag) => {
                    if (!form.value.tags) form.value.tags = [];
                    const idx = form.value.tags.indexOf(tag);
                    if (idx > -1) form.value.tags.splice(idx, 1);
                    else form.value.tags.push(tag);
                };

                const addNewTag = () => {
                    const t = prompt("標籤名稱");
                    if (t && !defaultTags.value.includes(t)) defaultTags.value.push(t);
                };

                onMounted(() => {
                    fetchFromCloud();
                    setInterval(fetchFromCloud, 40000);
                });

                return {
                    trips, activeTripIndex, currentTrip, loading, showModal, isEditing, form, lastSyncTime, defaultTags,
                    fetchFromCloud, saveToCloud, openCardModal, editCard, saveCard, removeCard, createNewTrip, addDay, removeDay, toggleTag, addNewTag, getDirectImageUrl, handleImageError
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
